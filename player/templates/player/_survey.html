<section class="card survey" id="survey" data-url="{{ survey_url }}"
         data-check-url="{% url 'player:survey_check' %}">
  <div class="pane-head">
    <h2>Анкета оператора</h2>
    <span class="pane-tools">
      <a class="btn btn-small" href="{{ survey_url }}" target="_blank" rel="noopener noreferrer"
         title="{{ survey_url }}" aria-label="Адрес анкеты: {{ survey_url }}">🔗</a>
      <button class="btn btn-small" type="button" id="survey-reload" title="Обновить страницу анкеты">↻</button>
      <button class="btn btn-small" type="button" id="survey-window" title="Открыть анкету в отдельном окне рядом">Окно рядом</button>
      <details class="more-menu">
        <summary class="btn btn-small" title="Подсказка и настройки">?</summary>
        <div class="more-menu-list survey-help">
          <p class="hint">Если вместо анкеты ошибка или вход, который не срабатывает, — нажмите «Окно рядом».
            Клавиши плеера не работают, пока курсор в анкете.</p>
          <label class="survey-pref">
            <input type="checkbox" id="survey-prefer-window"> Всегда открывать анкету отдельным окном
          </label>
        </div>
      </details>
    </span>
  </div>

  <div class="survey-blocked flash" id="survey-blocked" hidden>
    <p id="survey-blocked-reason"></p>
    <button class="btn btn-primary" type="button" id="survey-blocked-open">Открыть анкету в окне рядом</button>
  </div>

  <iframe class="survey-frame" id="survey-frame" title="Анкета оператора"
          referrerpolicy="no-referrer"></iframe>
</section>
