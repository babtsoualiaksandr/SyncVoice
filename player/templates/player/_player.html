<section class="card player" id="player"
         data-stream-url="{% url 'player:stream' audio.pk %}"
         data-subtitles-url="{% url 'player:subtitles' audio.pk %}"
         {% if audio.duration %}data-duration="{{ audio.duration|stringformat:'f' }}"{% endif %}>
  <audio id="audio" preload="metadata" src="{% url 'player:stream' audio.pk %}"></audio>

  <div class="caption" id="caption" aria-live="polite"></div>

  <div class="timeline" id="timeline" role="slider" tabindex="0"
       aria-label="Позиция воспроизведения" aria-valuemin="0" aria-valuenow="0">
    <div class="timeline-track">
      <div class="timeline-buffered" id="buffered"></div>
      <div class="timeline-segments" id="segment-marks"></div>
      <div class="timeline-progress" id="progress"></div>
      <div class="timeline-thumb" id="thumb"></div>
    </div>
    <div class="timeline-tooltip" id="tooltip" hidden></div>
  </div>

  <div class="time-row">
    <span id="current-time">0:00</span>
    <span id="duration">0:00</span>
  </div>

  <div class="controls">
    <div class="controls-group">
      <button class="icon-btn" id="prev-seg" title="Предыдущая фраза (↑)">⏮</button>
      <button class="icon-btn" id="back" title="Назад 5 с (←)">−5</button>
      <button class="icon-btn play" id="play" title="Играть / пауза (пробел)">▶</button>
      <button class="icon-btn" id="forward" title="Вперёд 5 с (→)">+5</button>
      <button class="icon-btn" id="next-seg" title="Следующая фраза (↓)">⏭</button>
    </div>

    <div class="controls-group speed" id="speed" role="group" aria-label="Скорость">
      <button data-rate="0.5">0.5×</button>
      <button data-rate="0.75">0.75×</button>
      <button data-rate="1">1×</button>
      <button data-rate="1.25">1.25×</button>
      <button data-rate="1.5">1.5×</button>
      <button data-rate="1.75">1.75×</button>
      <button data-rate="2">2×</button>
    </div>

    <div class="controls-group">
      <button class="toggle" id="loop-seg" aria-pressed="false" title="Повторять текущую фразу (L)">↻ Фраза</button>
      <button class="icon-btn" id="mute" title="Звук (M)">🔊</button>
      <input type="range" id="volume" min="0" max="1" step="0.05" value="1" aria-label="Громкость">
    </div>
  </div>
  <p class="hint keys">Пробел — пауза · ←/→ — 5 с · ↑/↓ — фраза · [ ] — скорость · L — повтор фразы · M — звук</p>
</section>

<section class="card transcript-card">
  <div class="transcript-head">
    <h2>Субтитры</h2>
    <span class="pane-zoom" data-zoom-pane="main"></span>
    <input type="search" id="search" placeholder="Поиск по тексту…" aria-label="Поиск по субтитрам">
    <button class="toggle" id="follow" aria-pressed="true" title="Прокручивать к текущей фразе">Следовать</button>
    <details class="save-menu" id="save-menu" {% if audio.status != 'done' %}hidden{% endif %}>
      <summary class="btn btn-primary">Сохранить субтитры</summary>
      <div class="save-menu-list">
        <button type="button" id="copy-subtitles" data-url="{% url 'player:download_subtitles' audio.pk 'txt' %}">
          <strong>В буфер обмена</strong><span>Текст с временем — вставить в письмо, чат, документ</span>
        </button>
        <a href="{% url 'player:download_subtitles' audio.pk 'txt' %}" download>
          <strong>TXT</strong><span>Текст с временем, для чтения</span>
        </a>
        <a href="{% url 'player:download_subtitles' audio.pk 'srt' %}" download>
          <strong>SRT</strong><span>Субтитры для видеоплееров</span>
        </a>
        <a href="{% url 'player:download_subtitles' audio.pk 'vtt' %}" download>
          <strong>VTT</strong><span>Субтитры для браузеров (WebVTT)</span>
        </a>
      </div>
    </details>
  </div>
  <div class="transcript" id="transcript">
    <p class="hint" id="transcript-empty">Загрузка…</p>
  </div>
</section>
